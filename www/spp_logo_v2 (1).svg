<?xml version="1.0" encoding="UTF-8"?>
<svg width="1500" height="300" viewBox="0 0 1500 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SPP | Subnational Politics Project">
  <defs>
    <style>
      .brand { font-family: "Montserrat", Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 1px; }
      .wordmark { font-family: "Montserrat", Arial, Helvetica, sans-serif; font-weight: 400; letter-spacing: 6px; }
    </style>
  </defs>

  <!-- Left: SPP -->
  <text id="brandText" x="20" y="210" class="brand" font-size="190" fill="#FFA92A">SPP</text>

  <!-- Fill the P counters (approximate positions) -->
  <!-- First P counter -->
  <rect x="255" y="88" width="70" height="62" rx="18" ry="18" fill="#FFA92A"/>
  <!-- Second P counter -->
  <rect x="365" y="88" width="70" height="62" rx="18" ry="18" fill="#FFA92A"/>

  <!-- Separator moved to the right of second P -->
  <line x1="520" y1="30" x2="520" y2="270" stroke="#4D4D4D" stroke-width="4"/>

  <!-- Right: stacked words -->
  <text x="560" y="95" class="wordmark" font-size="64" fill="#4D4D4D">SUBNATIONAL</text>
  <text x="560" y="165" class="wordmark" font-size="64" fill="#4D4D4D">POLITICS</text>
  <text x="560" y="235" class="wordmark" font-size="64" fill="#4D4D4D">PROJECT</text>
</svg>
