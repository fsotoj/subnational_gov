<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="300" viewBox="0 0 1500 300" role="img" aria-label="SPP | Subnational Politics Project">
<defs>
  <style>
    .brand { font-family: "Montserrat", Arial, Helvetica, sans-serif; font-weight: 900; letter-spacing: 1px; }
    .wordmark { font-family: "Gill Sans MT", "Gill Sans", Calibri, sans-serif; font-weight: 300; letter-spacing: 6px; }
  </style>
</defs>


  <!-- Left: SPP -->
  <text id="brandText" x="20" y="210" class="brand" font-size="190" fill="#FFA92A">SPP</text>

  <!-- Fill the P counters (approximate positions) -->
  <!-- First P counter -->
  <rect x="205" y="88" width="70" height="62" rx="18" ry="18" fill="#FFA92A"/>
  <!-- Second P counter -->
  <rect x="335" y="88" width="70" height="62" rx="18" ry="18" fill="#FFA92A"/>

  <!-- Separator moved to the right of second P -->
  <line x1="450" y1="75" x2="450" y2="210" stroke="#4D4D4D" stroke-width="4"/>

  <!-- Right: stacked words -->
  <text x="470" y="100" class="wordmark" font-size="40" fill="#4D4D4D">SUBNATIONAL</text>
  <text x="470" y="150" class="wordmark" font-size="40" fill="#4D4D4D">POLITICS</text>
  <text x="470" y="200" class="wordmark" font-size="40" fill="#4D4D4D">PROJECT</text>
</svg>